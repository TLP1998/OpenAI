plugins { id 'com.android.application' }
android {
  namespace 'com.tlp.bydvoiceprobe'
  compileSdk 35
  defaultConfig {
    applicationId 'com.tlp.bydvoiceprobe'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0.0-test'
  }
  flavorDimensions 'command'
  productFlavors {
    lock {
      dimension 'command'
      applicationIdSuffix '.lock'
      resValue 'string', 'app_name', '比亚迪锁车测试'
      resValue 'string', 'command_text', '锁车'
    }
    unlock {
      dimension 'command'
      applicationIdSuffix '.unlock'
      resValue 'string', 'app_name', '比亚迪解锁测试'
      resValue 'string', 'command_text', '解锁'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
