plugins { id 'com.android.application' }
android {
  namespace 'com.tlp.bydvoiceprobe'
  compileSdk 35
  defaultConfig { applicationId 'com.tlp.bydvoiceprobe'; minSdk 26; targetSdk 35; versionCode 4; versionName '2.2.0-xiaopoche' }
  flavorDimensions 'command'
  productFlavors {
    lock {
      dimension 'command'
      applicationIdSuffix '.lock'
      resValue 'string', 'app_name', '小破车上锁'
      resValue 'string', 'action_name', 'dev.vehiclebridge.byd.xiaoai.LOCK'
    }
    unlock {
      dimension 'command'
      applicationIdSuffix '.unlock'
      resValue 'string', 'app_name', '小破车解锁'
      resValue 'string', 'action_name', 'dev.vehiclebridge.byd.xiaoai.UNLOCK'
    }
    lockshutdown {
      dimension 'command'
      applicationIdSuffix '.lockshutdown'
      resValue 'string', 'app_name', '小破车上锁并熄火'
      resValue 'string', 'action_name', 'dev.vehiclebridge.byd.xiaoai.LOCK_SHUTDOWN'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
