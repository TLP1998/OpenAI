plugins { id 'com.android.application' }
android {
  namespace 'com.tlp.bydvoiceprobe'
  compileSdk 35
  defaultConfig { applicationId 'com.tlp.bydvoiceprobe'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0.0-xiaoai' }
  flavorDimensions 'command'
  productFlavors {
    lock {
      dimension 'command'
      applicationIdSuffix '.lock'
      resValue 'string', 'app_name', '比亚迪锁车测试'
      resValue 'string', 'action_name', 'dev.vehiclebridge.byd.xiaoai.LOCK'
    }
    unlock {
      dimension 'command'
      applicationIdSuffix '.unlock'
      resValue 'string', 'app_name', '比亚迪解锁测试'
      resValue 'string', 'action_name', 'dev.vehiclebridge.byd.xiaoai.UNLOCK'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
