name: BYD Assistant V3 - Build Unified Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ChatGPT/TLP/BYD Assistant/V3/**'
      - '.github/workflows/byd-assistant-v3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout TLP project
        uses: actions/checkout@v4

      - name: Checkout pinned BYD Vehicle Bridge upstream
        uses: actions/checkout@v4
        with:
          repository: fm1223/byd-android
          ref: 57434bede7e19342e512924a14439cca45738b96
          path: 'ChatGPT/TLP/BYD Assistant/V3/upstream'
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n1)
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Apply V3 one-APK source patch
        run: |
          python3 'ChatGPT/TLP/BYD Assistant/V3/patch_upstream.py' \
            'ChatGPT/TLP/BYD Assistant/V3/upstream' \
            'ChatGPT/TLP/BYD Assistant/V3/overlay'

      - name: Compile unified Android APK
        run: gradle --no-daemon -p 'ChatGPT/TLP/BYD Assistant/V3/upstream' :app:assembleDebug

      - name: Validate APK and four launch entry activities
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 'ChatGPT/TLP/BYD Assistant/V3/upstream/app/build/outputs/apk/debug/app-debug.apk' dist/xiaopoche-v3-unified.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/xiaopoche-v3-unified.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree dist/xiaopoche-v3-unified.apk AndroidManifest.xml > "$RUNNER_TEMP/v3-manifest-dump.txt"
          grep -q 'VoiceLockActivity' "$RUNNER_TEMP/v3-manifest-dump.txt"
          grep -q 'VoiceUnlockActivity' "$RUNNER_TEMP/v3-manifest-dump.txt"
          grep -q 'VoiceLockCloseAirActivity' "$RUNNER_TEMP/v3-manifest-dump.txt"
          grep -q 'MainActivity' "$RUNNER_TEMP/v3-manifest-dump.txt"
          sha256sum dist/xiaopoche-v3-unified.apk > dist/SHA256SUMS.txt

      - name: Save V3 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Assistant-V3-One-APK
          path: dist/*
          if-no-files-found: error

      - name: Publish V3 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=byd-xiaoai-v3
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title 'BYD Assistant V3 - One APK, Four Launch Entries (Preview)' \
            --notes 'Preview: single Android APK with main UI, XiaoPoChe lock, unlock, and lock+CLOSEAIR launcher entries. XiaoAI recognition of multiple launcher activities within the same package is NOT verified on Xiaomi 15. Keeps V2.2 as recommended fallback. Warning: voice unlock has no second confirmation and may run on the lock screen; no speaker verification. CLOSEAIR is air-conditioning control, not verified engine power-off. Based on nonofficial BYD API implementation; no Bemfa cloud.' \
            --prerelease
          gh release upload "$TAG" dist/xiaopoche-v3-unified.apk dist/SHA256SUMS.txt --clobber
