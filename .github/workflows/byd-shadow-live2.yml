name: BYD V4.0.30 Shadow LIVE2 RSSI Display APK
on:
  push:
    paths:
      - '.github/workflows/byd-shadow-live2.yml'
      - 'ChatGPT/TLP/BYD Assistant/ShadowFieldV4030Live2/**'
  workflow_dispatch:
concurrency:
  group: byd-shadow-live2-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  assemble-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform and build tools using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Verify and extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SRC='ChatGPT/TLP/BYD Assistant/ShadowFieldV4030Live2/Android_Shadow_Logger_LIVE2_source.zip'
          echo 'e5b38e2804e786d1e944de3bf08eb81bca5a1716c7e10ffe22751d22dbe4005d  '"$SRC" | sha256sum -c -
          mkdir -p shadow-project
          unzip -q "$SRC" -d shadow-project
          test -f shadow-project/app/build.gradle
      - name: Compile APK
        run: gradle --no-daemon -p shadow-project :app:assembleDebug
      - name: Verify APK signature, identity and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=shadow-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > SHADOW_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > SHADOW_IDENTITY.txt
          grep -q "package: name='com.tlp1998.xiaodi.shadowprobe.live' versionCode='4030002'" SHADOW_IDENTITY.txt
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected INTERNET permission'; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/byd-shadow-v4.0.30-live-rssi.apk
          cp SHADOW_SIGNATURE.txt SHADOW_IDENTITY.txt dist/
          (cd dist && sha256sum byd-shadow-v4.0.30-live-rssi.apk > SHA256SUMS.txt)
      - name: Publish downloadable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-V4030-LIVE-RSSI-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
