<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>TLP · 技术项目知识库</title>
<style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172b46;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#102b4e,#225178);color:#fff;padding:45px max(22px,calc((100vw - 1100px)/2)) 38px}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.75}h1{font-size:clamp(27px,4vw,40px);margin:10px 0}header p{opacity:.86;margin:0;line-height:1.7}main{max-width:1100px;margin:auto;padding:30px 22px 60px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 24px}.stat{background:white;border:1px solid #e0e7f0;border-radius:13px;padding:17px 23px;min-width:145px;box-shadow:0 3px 14px #16335b08}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:#62758d}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}.toolbar input,.toolbar select{font:inherit;padding:12px 14px;border:1px solid #cdd8e6;border-radius:10px;background:white;color:#243f60}.toolbar input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}.project{background:white;border:1px solid #dfe7f0;border-radius:16px;padding:24px;box-shadow:0 4px 18px #173d6108}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.category{font-size:12px;color:#3b6289;font-weight:700}.status{font-size:12px;color:#166448;background:#e5f6ee;padding:5px 10px;border-radius:20px}.project h2{font-size:21px;margin:18px 0 9px}.project p{font-size:14px;color:#536780;line-height:1.8;min-height:50px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tag{font-size:12px;background:#f0f4f9;color:#47637e;padding:5px 9px;border-radius:6px}.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.actions a{font-size:14px;text-decoration:none;font-weight:700;color:#17568a}.actions a.primary{background:#194e7c;color:white;padding:11px 15px;border-radius:9px}.empty{display:none;color:#62758d;padding:28px;text-align:center}footer{border-top:1px solid #dce5ee;margin-top:40px;padding-top:20px;color:#7b8b9e;font-size:12px}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77baf0;outline-offset:2px}@media(max-width:600px){header{padding:30px 20px}main{padding:20px 16px}.stat{flex:1;min-width:95px;padding:13px}.stat strong{font-size:22px}.project{padding:20px}}</style></head>
<body><header><div class="eyebrow">TLP / PROJECT HUB</div><h1>技术项目知识库</h1><p>统一管理工程研究、技术日报与知识成果<br>项目独立归档 · 网页快速阅读 · 长期持续积累</p></header>
<main><div class="stats"><div class="stat"><strong id="total">1</strong><span>项目总数</span></div><div class="stat"><strong id="active">1</strong><span>进行中</span></div><div class="stat"><strong>11</strong><span>已归档日报 HTML</span></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="搜索项目名称、描述、标签…" aria-label="搜索项目"><select id="category" aria-label="项目类别"><option value="">全部类别</option><option value="技术研究">技术研究</option><option value="效率工具">效率工具</option></select><select id="status" aria-label="项目状态"><option value="">全部状态</option><option value="进行中">进行中</option><option value="已完成">已完成</option><option value="暂停">暂停</option></select></div>
<section id="projects" class="grid" aria-label="项目列表"></section><p id="empty" class="empty">没有符合筛选条件的项目。</p>
<footer>项目文件存储于 GitHub · 本页面通过 GitHub Pages 发布。新增项目时更新本页项目数据；已有项目的独立目录和历史链接保持不变。</footer></main>
<script>
const projects=[{name:"动力电池技术日报",en:"Daily Report on Power Battery Technology",category:"技术研究",status:"进行中",description:"围绕动力电池工程技术开展持续深度研究，涵盖电芯、BMS、EMC、高压架构、热安全及工程验证。",tags:["动力电池","技术精读","EMC","BMS","800V"],count:11,url:"./Daily%20Report%20on%20Power%20Battery%20Technology/index.html",repo:"https://github.com/TLP1998/OpenAI/tree/main/ChatGPT/TLP/Daily%20Report%20on%20Power%20Battery%20Technology"},{name:"TLP Transfer｜GPT 中转站",en:"TLP Transfer",category:"效率工具",status:"进行中",description:"GPT 成果发布与附件下载，支持登录后在线回复、多设备云端同步，并保留手动口令备用方式。",tags:["中转站","在线回复","跨设备同步","文件下载"],count:1,url:"./TLP%20Transfer/index.html",repo:"https://github.com/TLP1998/OpenAI/tree/main/ChatGPT/TLP/TLP%20Transfer"}];
const search=document.getElementById("search"),category=document.getElementById("category"),status=document.getElementById("status"),grid=document.getElementById("projects"),empty=document.getElementById("empty");
function render(){const q=search.value.trim().toLowerCase(),c=category.value,s=status.value;const visible=projects.filter(p=>(!c||p.category===c)&&(!s||p.status===s)&&(!q||[p.name,p.en,p.description,...p.tags].join(" ").toLowerCase().includes(q)));grid.replaceChildren();for(const p of visible){const card=document.createElement("article");card.className="project";const tags=p.tags.map(t=>'<span class="tag">'+t+'</span>').join("");card.innerHTML='<div class="meta"><span class="category">'+p.category+'</span><span class="status">'+p.status+'</span></div><h2>'+p.name+'</h2><p>'+p.description+'</p><div class="tags">'+tags+'</div><div class="actions"><a class="primary" href="'+p.url+'">进入项目目录 →</a><a href="'+p.repo+'">查看 GitHub 文件</a></div>';grid.appendChild(card)}empty.style.display=visible.length?"none":"block";document.getElementById("total").textContent=projects.length;document.getElementById("active").textContent=projects.filter(p=>p.status==="进行中").length}for(const el of [search,category,status])el.addEventListener("input",render);render();
</script></body></html>
