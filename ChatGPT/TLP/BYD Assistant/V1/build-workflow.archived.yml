name: Build BYD XiaoAI V1 APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'BYD-XiaoAI-V1-Voice-Probe/**'
      - '.github/workflows/byd-xiaoai-v1.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner cmdline tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n1)
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APKs
        run: gradle --no-daemon -p BYD-XiaoAI-V1-Voice-Probe :app:assembleLockDebug :app:assembleUnlockDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BYD-XiaoAI-V1-two-APKs
          path: BYD-XiaoAI-V1-Voice-Probe/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=byd-xiaoai-v1-test
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'BYD XiaoAI V1 - Voice Entry Test' --notes 'Safe test only: no network, no BYD API, no vehicle control. Two independent Android apps to test whether XiaoAI can launch distinct voice entries.'
          gh release upload "$TAG" BYD-XiaoAI-V1-Voice-Probe/app/build/outputs/apk/lock/debug/app-lock-debug.apk BYD-XiaoAI-V1-Voice-Probe/app/build/outputs/apk/unlock/debug/app-unlock-debug.apk --clobber
