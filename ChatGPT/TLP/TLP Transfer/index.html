<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TLP Transfer 中转站：GitHub Pages 收件箱、文件下载、免费在线同步回复。">
<title>TLP Transfer｜GPT 中转站</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1e3451;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#122d50,#265878);color:white;padding:32px max(18px,calc((100vw - 1100px)/2))}header a{color:#d4e7f8;text-decoration:none;font-size:14px}header h1{font-size:clamp(27px,4vw,37px);margin:12px 0 6px}header p{margin:0;font-size:14px;color:#d5e3ef}main{max-width:1100px;margin:auto;padding:25px 20px 55px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}input,select{font:inherit;background:white;padding:11px;border:1px solid #cad9e9;border-radius:9px;color:#253f5b}input{flex:1;min-width:200px}small,.hint{color:#637d96}.layout{display:grid;grid-template-columns:305px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #dce7f1;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px #1738580a}.panel-head{padding:17px 20px;font-weight:700;border-bottom:1px solid #e5ecf3}.item{width:100%;display:block;text-align:left;font:inherit;background:#fff;border:0;border-bottom:1px solid #e6eef5;padding:18px;cursor:pointer;color:#253e58}.item:hover,.item.active{background:#eaf3fd}.item strong{display:block;font-size:15px}.item span{display:block;color:#73879b;font-size:12px;margin-top:7px}.detail{padding:24px}.detail h2{margin:10px 0 7px}.meta{font-size:12px;color:#64809b}.detail p{line-height:1.75}.attachments{padding:15px;background:#f2f7fb;border-radius:10px;margin:17px 0}.attachments a{display:block;padding-top:9px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:9px;font:inherit;font-size:14px;border:0;background:#1d5787;color:white;text-decoration:none;cursor:pointer}.btn.secondary{background:#e7eff8;color:#20537e}.buttons{display:flex;flex-wrap:wrap;gap:10px}.reply-area{border-top:1px solid #dfebf4;margin-top:24px;padding-top:20px}.notice{border:1px solid #cde1f1;background:#f0f7fd;border-radius:10px;padding:13px 14px;font-size:13px;line-height:1.8;margin:12px 0}.comments{margin:12px 0}.comment{border-left:3px solid #aac8e6;background:#f7faff;padding:12px 15px;border-radius:0 8px 8px 0;margin:10px 0}.comment p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.comment .who{font-size:12px;color:#647b93}.comment a{font-size:12px}.status{font-size:13px;color:#53728d;margin:10px 0}.utterances{max-width:none!important}.legacy{padding:12px 15px;border:1px dashed #d0dce7;border-radius:9px;color:#4b6178;font-size:13px;margin:12px 0}footer{font-size:12px;color:#72879b;line-height:1.8;margin-top:25px}a{color:#176399;overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fb9ed;outline-offset:2px}@media(max-width:750px){.layout{grid-template-columns:1fr}.detail{padding:18px}main{padding:18px 14px 45px}header{padding:26px 17px}}
</style></head><body>
<header><a href="../index.html">← TLP 项目总目录</a><h1>📥 TLP Transfer</h1><p>GPT 中转站 · 成果阅读 · 附件下载 · GitHub 在线回复</p></header>
<main>
<div class="tools"><input id="search" type="search" placeholder="搜索标题 / 编号 / 关键词…" aria-label="搜索消息"><select id="filter" aria-label="消息类别"><option value="">全部类别</option><option value="系统测试">系统测试</option><option value="技术研究">技术研究</option><option value="文档资料">文档资料</option><option value="代码工具">代码工具</option></select><small id="counter"></small></div>
<div class="layout"><section class="panel" aria-label="消息列表"><div class="panel-head">收件箱</div><div id="list"></div></section><section class="panel" aria-label="消息详情"><div id="detail" class="detail"></div></section></div>
<footer>仅用于发布经许可公开的非敏感内容。网页及 GitHub Issue 评论均为公开信息。在线发布需要登录 GitHub，密码由 GitHub 处理，本网站不保存密码。请遵守公司外发及沙箱使用规定。</footer>
</main>
<script>
const repo="TLP1998/OpenAI";
const messages=[{
 id:"TLP-20261015-001",title:"TLP Transfer 功能验证消息",date:"2026-10-15",category:"系统测试",
 summary:"阅读完整回复、下载附件，并测试网页在线回复与跨设备同步。",
 body:["欢迎使用 TLP Transfer 中转站。这是公开且不含敏感信息的测试消息。","当前版本把每条消息的在线回复存储在 GitHub Issue 评论区。新回复不需要修改 GitHub Pages 文件，也无需单独的数据库。"],
 page:"messages/2026-10-15-001.html",files:[{name:"测试附件（TXT）",url:"attachments/2026-10-15-001-readme.txt"}],issueNumber:1
}];
const $=id=>document.getElementById(id), list=$("list"),detail=$("detail"),search=$("search"),filter=$("filter");let current=messages[0]?.id||"",loadToken=0;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function link(label,url,cls){const e=el("a",label,cls);e.href=url;e.rel="noopener noreferrer";return e}
function add(node,...children){node.append(...children);return node}
function showList(){const q=search.value.trim().toLowerCase(),c=filter.value;const rows=messages.filter(m=>(!c||m.category===c)&&(!q||[m.id,m.title,m.summary,m.category,...m.body].join(" ").toLowerCase().includes(q)));list.replaceChildren();$("counter").textContent=rows.length+" 条";if(!rows.length){list.append(el("p","没有符合条件的消息。","hint"));detail.replaceChildren();return}if(!rows.some(m=>m.id===current))current=rows[0].id;for(const m of rows){const b=el("button",undefined,"item"+(m.id===current?" active":""));b.type="button";add(b,el("strong",m.title),el("span",m.date+" · "+m.id));b.onclick=()=>{current=m.id;showList()};list.append(b)}showDetail(messages.find(m=>m.id===current))}
function mountUtterances(target,number){target.replaceChildren();const script=document.createElement("script");script.src="https://utteranc.es/client.js";script.setAttribute("repo",repo);script.setAttribute("issue-number",String(number));script.setAttribute("theme","github-light");script.crossOrigin="anonymous";script.async=true;script.onerror=()=>target.replaceChildren(el("p","在线评论组件加载失败。请使用下方 GitHub 直达链接发布回复。","status"));target.append(script)}
function showDetail(m){const token=++loadToken;detail.replaceChildren(el("div",m.category+" · "+m.date,"meta"),el("h2",m.title),el("div","消息编号："+m.id,"meta"));for(const p of m.body)detail.append(el("p",p));const actions=el("div",undefined,"buttons");actions.append(link("阅读完整消息",m.page,"btn secondary"));detail.append(actions);const attachments=el("div",undefined,"attachments");attachments.append(el("strong","📎 附件下载"));for(const f of m.files)attachments.append(link("↓ "+f.name,f.url));detail.append(attachments);
const area=el("section",undefined,"reply-area");area.append(el("h3","在线回复 · 跨设备同步"));area.append(el("div","使用 GitHub 登录后，即可在下方评论框直接发送回复。回复会保存到该消息对应的 GitHub Issue；其他设备可刷新查看。不需要另设中转站密码，也不使用单独数据库。","notice"));
const url="https://github.com/"+repo+"/issues/"+m.issueNumber;
const actions2=el("div",undefined,"buttons");actions2.append(link("在 GitHub 打开回复页 ↗",url,"btn secondary"),link("首次启用网页内评论组件 ↗","https://github.com/apps/utterances","btn secondary"));area.append(actions2);
const latest=el("div");const status=el("p","正在读取已发布的回复…","status"), comments=el("div",undefined,"comments");latest.append(el("h4","已同步回复"),status,comments);const refresh=el("button","刷新回复记录","btn secondary");refresh.type="button";refresh.onclick=()=>loadComments(m.issueNumber,token,status,comments);latest.append(refresh);area.append(latest);
const widget=el("div");widget.append(el("h4","填写并发送新回复"));widget.append(el("p","下面是 GitHub 的评论输入框。需要首次安装 utterances 到该仓库（只需仓库管理员操作一次），然后通过 GitHub 登录。","hint"));const slot=el("div");widget.append(slot);area.append(widget);detail.append(area);
const legacy=el("div",undefined,"legacy");legacy.textContent="旧版测试口令“测试回复同步”已保存于历史 GitHub 归档，但不会自动变成新的 Issue 评论。若要验证本版在线发送，请在下面的评论框重新提交一条新测试回复。";detail.append(legacy);
mountUtterances(slot,m.issueNumber);loadComments(m.issueNumber,token,status,comments)}
async function loadComments(issue,token,status,holder){status.textContent="正在从 GitHub 获取评论…";try{const res=await fetch("https://api.github.com/repos/"+repo+"/issues/"+issue+"/comments?per_page=100&cachebuster="+Date.now(),{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});if(!res.ok)throw new Error("HTTP "+res.status);const arr=await res.json();if(token!==loadToken)return;holder.replaceChildren();status.textContent=arr.length?"已同步 "+arr.length+" 条 GitHub 回复":"当前还没有在线回复。";for(const msg of arr){const card=el("article",undefined,"comment"),user=msg.user?.login||"GitHub 用户",when=msg.created_at?new Date(msg.created_at).toLocaleString("zh-CN"):"";card.append(el("div",user+" · "+when,"who"),el("p",msg.body||""));if(msg.html_url)card.append(link("查看 GitHub 原评论 ↗",msg.html_url));holder.append(card)}}catch(err){if(token!==loadToken)return;status.textContent="获取在线评论失败（网络或 GitHub API 限额）。可以点击“在 GitHub 打开回复页”查看或发布。"}}
search.oninput=showList;filter.onchange=showList;const hash=decodeURIComponent(location.hash.substring(1));if(messages.some(x=>x.id===hash))current=hash;showList();
</script></body></html>
