<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLP Transfer｜GPT 中转站</title><meta name="description" content="TLP Transfer GPT 成果单向收件箱，支持只读消息、下载附件和关联回复记录与口令。">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20344e;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(118deg,#102a4e,#25567b);color:#fff;padding:32px max(18px,calc((100vw - 1100px)/2))}header a{color:#cde3f7;text-decoration:none;font-size:13px}header h1{font-size:clamp(26px,4vw,38px);margin:12px 0 4px}header p{margin:0;color:#c9d9e9;font-size:14px}main{max-width:1100px;margin:0 auto;padding:26px 20px 55px}.bar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.bar input,.bar select,textarea{font:inherit;border:1px solid #cfdaea;border-radius:10px;padding:12px;background:#fff;color:#243f60}.bar input{flex:1;min-width:200px}.bar select{min-width:125px}.counter{font-size:13px;color:#59708a}.columns{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #203b5910}.panel-title{padding:17px 20px;border-bottom:1px solid #e6ecf3;font-weight:700}.message{display:block;padding:18px 19px;border:0;border-bottom:1px solid #e9eef4;width:100%;background:#fff;text-align:left;cursor:pointer;color:#223750;font:inherit}.message:hover,.message.selected{background:#edf5fd}.message-title{font-weight:700;display:block;line-height:1.5}.message-sub{display:block;font-size:12px;color:#627892;margin-top:7px;line-height:1.6}.detail{padding:24px}.detail h2{margin:7px 0 10px;font-size:23px}.detail p{line-height:1.8}.eyebrow{font-size:12px;color:#41719e;font-weight:700}.hint{font-size:13px;color:#65788e}.attachments{margin:18px 0;padding:16px;background:#f3f7fb;border-radius:10px}.attachments a{color:#145b98;display:block;padding:5px 0;overflow-wrap:anywhere}.buttons{display:flex;gap:9px;flex-wrap:wrap}.button{border:0;border-radius:9px;padding:11px 15px;background:#1a5586;color:#fff;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}.button.secondary{background:#e8f0f9;color:#1a4f79}.reply{margin-top:22px;padding-top:20px;border-top:1px solid #e1e8f0}.reply textarea{width:100%;min-height:90px;resize:vertical;margin:8px 0}.reply-preview{background:#f2f6fa;padding:12px;border-radius:9px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap;margin:10px 0}.warning{background:#fff8e8;border:1px solid #f0deb0;padding:13px;border-radius:9px;color:#795728;font-size:13px;line-height:1.7;margin:18px 0}.empty{padding:28px;color:#667b91}footer{font-size:12px;color:#778ba0;line-height:1.7;margin-top:22px}a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #71aff1;outline-offset:2px}@media(max-width:750px){.columns{grid-template-columns:1fr}.detail{padding:19px}.bar{gap:9px}header{padding:25px 19px}}
.thread{margin-top:20px;padding-top:18px;border-top:1px solid #dce6f0}.thread h3{margin:8px 0}.thread-item{border-left:3px solid #9abce0;background:#f4f8fd;padding:11px 14px;margin:10px 0;border-radius:0 8px 8px 0}.thread-item p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-weight:700;color:#1b5a87;background:#e8f2fb;border-radius:999px;padding:4px 10px;font-size:12px;display:inline-block}.notice{padding:12px 14px;border:1px solid #cbdbea;background:#edf5fe;border-radius:10px;font-size:13px;line-height:1.7}.subtle{color:#6a8299;font-size:12px}.refresh{margin:9px 0}.thread .button{font-size:12px;padding:7px 10px}
.online-panel{margin:22px 0;padding:20px;border:1px solid #c9ddea;border-radius:12px;background:#f8fbfe}.online-panel h3{margin-top:0}.online-panel h4{margin:18px 0 8px}.online-login-row{display:flex;gap:9px;flex-wrap:wrap}.online-login-row input{flex:1;min-width:190px;font:inherit;padding:10px;border:1px solid #cfdaea;border-radius:9px}.online-panel textarea{width:100%;min-height:110px;margin-bottom:10px;resize:vertical}.online-panel .button{margin:5px 8px 5px 0}.online-feedback{font-size:12px;color:#276b52;margin:9px 0;line-height:1.7}.online-feedback.error{color:#ab3c35}.online-notice{background:#fff6e6;border:1px solid #efdbb5;border-radius:8px;padding:12px;font-size:13px;line-height:1.7;margin:12px 0}.online-entry{padding:10px 14px;margin:10px 0;border-left:3px solid #86b2d5;background:#fff;border-radius:0 7px 7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.online-entry p{margin:4px 0}.online-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}</style></head><body>
<header><a href="../index.html">← TLP 项目总目录</a><h1>📥 TLP Transfer</h1><p>GPT 中转站 · 成果收件箱 · 在线回复 · 附件下载</p></header>
<main>
<div class="bar"><input type="search" id="query" placeholder="搜索标题、消息编号和关键词…" aria-label="搜索消息"><select id="category" aria-label="类别"><option value="">全部类别</option><option value="系统测试">系统测试</option><option value="技术研究">技术研究</option><option value="文档资料">文档资料</option><option value="代码工具">代码工具</option><option value="其他">其他</option></select><span class="counter" id="count"></span></div>
<div class="columns"><section class="panel" aria-label="消息列表"><div class="panel-title">收件箱</div><div id="list"></div></section><section class="panel" aria-label="消息详情"><div id="detail" class="detail"><p class="hint">请选择一条消息查看详细内容。</p></div></section></div>
<footer>此页面的历史消息和附件公开可访问；云端在线回复须登录后才能发布和查看，手动回复口令仍作为备用方式。仅可提交获准公开的非敏感内容。公司电脑与沙箱之间的安全限制须遵守，不可通过拆分、编码等方式规避。</footer>
</main>
<script src="online-config.js"></script>
<script src="online-replies.js"></script>
<script>
const messages=[{id:"TLP-20261015-001",title:"TLP Transfer 功能验证消息",date:"2026-10-15",category:"系统测试",summary:"验证完整回复阅读、附件下载和短口令功能。",body:["欢迎使用 TLP Transfer（中转站）。这是公开且无敏感信息的第一条测试消息。","测试内容：打开消息详情、访问完整正文、下载 TXT 附件、使用关联短回复口令。"],page:"messages/2026-10-15-001.html",files:[{name:"测试附件（TXT）",url:"attachments/2026-10-15-001-readme.txt"}]}];
let threads={};let syncError=false;
const list=document.getElementById("list"),detail=document.getElementById("detail"),query=document.getElementById("query"),cat=document.getElementById("category"),count=document.getElementById("count");let current=messages[0]?.id||null;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(label,url,cls){const a=node("a",label,cls);a.href=url;return a}
function renderList(){const q=query.value.toLowerCase().trim(),c=cat.value;const filtered=messages.filter(x=>(!c||x.category===c)&&(!q||[x.id,x.title,x.category,x.summary,...x.body].join(" ").toLowerCase().includes(q)));list.replaceChildren();count.textContent=filtered.length+" 条消息";if(!filtered.length){list.append(node("div","没有找到符合条件的消息。","empty"));detail.replaceChildren(node("p","请选择其他筛选条件。","hint"));return}if(!filtered.some(x=>x.id===current))current=filtered[0].id;for(const m of filtered){const b=node("button",undefined,"message"+(m.id===current?" selected":""));b.type="button";b.append(node("span",m.title,"message-title"),node("span",m.date+" · "+m.id+" · "+m.category,"message-sub"));b.addEventListener("click",()=>{current=m.id;renderList()});list.append(b)}renderDetail(messages.find(x=>x.id===current))}
function appendHistory(container,title,entries,empty){container.append(node("h3",title));if(!entries.length){container.append(node("p",empty,"hint"));return}for(const x of entries){const item=node("div",undefined,"thread-item");item.append(node("div",(x.date||"日期未标注")+" · "+(x.by||"已发布记录"),"subtle"),node("p",x.text||""));if(x.link)item.append(link("查看关联内容 →",x.link));container.append(item)}}
function renderDetail(m){detail.replaceChildren();detail.append(node("div",m.category+" · "+m.date,"eyebrow"),node("h2",m.title),node("div","消息编号："+m.id,"hint"));m.body.forEach(t=>detail.append(node("p",t)));const acts=node("div",undefined,"buttons");acts.append(link("查看完整消息 →",m.page,"button"));detail.append(acts);
const files=node("div",undefined,"attachments");files.append(node("strong","📎 附件下载"));for(const f of m.files)files.append(link("↓ "+f.name,f.url));detail.append(files);
const history=node("section",undefined,"thread");history.append(node("h3","GPT 归档回复（旧版）"));const t=threads[m.id]||{status:"待回复",replies:[],results:[]};history.append(node("span","状态："+(t.status||"待回复"),"status"));history.append(node("p",syncError?"回复记录暂时加载失败，可尝试刷新；不要将空白视为无回复。":"仅展示已通过 ChatGPT 提交并成功发布到 GitHub 的回复记录。","hint"));appendHistory(history,"已发布回复",t.replies||[],"暂无已发布回复。网页输入的未提交草稿不会显示在其他设备。");appendHistory(history,"GPT 处理结果",t.results||[],"暂无已发布的 GPT 处理结果。");const refresh=node("button","刷新回复记录","button secondary refresh");refresh.type="button";refresh.addEventListener("click",()=>loadThreads());history.append(refresh);detail.append(history);
const section=node("section",undefined,"reply");section.append(node("h3","备用：手动提交口令"));section.append(node("div","第 1 步：在这里输入非敏感简短要求并复制口令。第 2 步：在手机或私人电脑的 ChatGPT 中粘贴并发送。第 3 步：由 GPT 确认提交并发布关联记录。第 4 步：返回本页刷新回复记录。","notice"));const ta=node("textarea");ta.maxLength=50;ta.placeholder="例如：继续分析、整理为Word（请勿输入公司敏感内容）";ta.setAttribute("aria-label","简短回复意见");section.append(ta);const preview=node("div",undefined,"reply-preview"),usage=node("div",undefined,"hint"),copy=node("button","复制口令（不发送）","button");copy.type="button";const prefix="中转站回复 "+m.id+" ";function update(){const budget=50-[...prefix].length;const v=[...ta.value.trim()].slice(0,budget).join("");if(ta.value!==v)ta.value=v;const s=prefix+(v||"继续处理");preview.textContent=s;usage.textContent="口令长度："+[...s].length+"/50 字；仅适用于允许传递的非敏感简短意见。";copy.disabled=[...s].length>50}ta.addEventListener("input",update);copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(preview.textContent);copy.textContent="已复制，尚未发送";setTimeout(()=>copy.textContent="复制口令（不发送）",2000)}catch(e){const range=document.createRange();range.selectNodeContents(preview);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);copy.textContent="请手动复制已选文字"}});section.append(preview,usage,copy);section.append(node("div","重要：输入文字或点击“复制口令”都不会发送消息，也不会自动同步其他网页。须在 ChatGPT 中主动提交；发布成功后才会产生跨设备记录。","warning"));detail.append(section);update();if(window.TLPOnline)window.TLPOnline.attach(detail,m)}
async function loadThreads(){try{const response=await fetch("./threads.json?refresh="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(!data||!data.threads||typeof data.threads!=="object")throw new Error("Invalid data");threads=data.threads;syncError=false}catch(e){syncError=true}renderList()}
query.addEventListener("input",renderList);cat.addEventListener("change",renderList);const hash=decodeURIComponent(location.hash.slice(1));if(messages.some(m=>m.id===hash))current=hash;renderList();loadThreads();
</script></body></html>
